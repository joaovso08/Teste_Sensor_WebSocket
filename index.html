<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Leitura de Sensor (WebSocket)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
            flex-direction: column;
            gap: 20px;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
        }
        #statusMessage {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background-color: #cfe2ff;
            color: #052c65;
            border: 1px solid #b9d7fd;
        }
        .loading {
            background-color: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simulador de Leitura de Sensor (WebSocket)</h1>
        <p>Digite o código EPC do usuário para simular a passagem pelo sensor.</p>
        <label for="epcInput">Código EPC:</label>
        <input type="text" id="epcInput" placeholder="Ex: AABBCCDD11223344">
        <button id="sendEpcButton">Simular Leitura</button>
        <div id="statusMessage"></div>
    </div>

    <script>
        const epcInput = document.getElementById('epcInput');
        const sendEpcButton = document.getElementById('sendEpcButton');
        const statusMessage = document.getElementById('statusMessage');
        const WEBSOCKET_URL = 'wss://s14655.nyc1.piesocket.com/v3/1?api_key=HfzN46IBGbvWsdXvqz2VHLupJtADPyodwpkLSZOk&notify_self=1';

        let ws; 

        function connectWebSocket() {
            displayMessage('Conectando ao WebPieSocket...', 'info');
            ws = new WebSocket(WEBSOCKET_URL);

            ws.onopen = () => {
                displayMessage('Conectado ao WebPieSocket!', 'success');
                sendEpcButton.disabled = false; 
            }
            ws.onmessage = (event) => {
                console.log('Mensagem recebida do servidor:', event.data);
            };

            ws.onclose = () => {
                displayMessage('Desconectado do WebPieSocket. Tentando reconectar em 5s...', 'error');
                sendEpcButton.disabled = true;
                setTimeout(connectWebSocket, 5000);
            };

            ws.onerror = (error) => {
                displayMessage('Erro no WebSocket. Verifique o console.', 'error');
                console.error('WebSocket Error:', error);
            };
        }

        async function sendEpcData() {
            const epcCode = epcInput.value.trim();

            if (!epcCode) {
                displayMessage('Por favor, digite um código EPC.', 'error');
                return;
            }

            if (ws.readyState !== WebSocket.OPEN) {
                displayMessage('Conexão WebSocket não está aberta. Tentando reconectar...', 'error');
                connectWebSocket(); 
                return;
            }

            displayMessage('Enviando código EPC via WebSocket...', 'loading');
            sendEpcButton.disabled = true;

            try {
                
                const payload = { 
                    epcCode: epcCode,
                    data: new Date().toISOString()
                };
                ws.send(JSON.stringify(payload));
                displayMessage(`EPC Code "${epcCode}" enviado com sucesso!`, 'success');
                epcInput.value = ''; 
            } catch (error) {
                console.error('Erro ao enviar dados via WebSocket:', error);
                displayMessage('Erro ao enviar dados via WebSocket.', 'error');
            } finally {
                sendEpcButton.disabled = false; 
            }
        }

        function displayMessage(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `statusMessage ${type}`;
            statusMessage.style.display = 'block';
        }

        
        sendEpcButton.addEventListener('click', sendEpcData);

        
        epcInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendEpcData();
            }
        });

        connectWebSocket();
    </script>
</body>
</html>
